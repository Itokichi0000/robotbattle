<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050B13" />
    <meta name="robots" content="noindex" />
    <title>SATS WARS — Main Display</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050b13;
        overflow: hidden;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        color: #93aebc;
        font:
          600 14px/1.4 system-ui,
          sans-serif;
        letter-spacing: 0.24em;
        text-align: center;
      }
      #boot b {
        color: #e5eef3;
        font-size: 28px;
        letter-spacing: 0.18em;
      }
      #boot i {
        display: block;
        width: 280px;
        height: 2px;
        background: #263844;
        overflow: hidden;
      }
      #boot i::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #5bcada;
        animation: boot 1.6s ease-in-out infinite;
      }
      @keyframes boot {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot"><b>SATS WARS</b>EARTH DEFENSE SYSTEM BOOT<i></i></div>
    </div>
    <noscript>JavaScript is required for the main display.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
